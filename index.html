<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --surface2: #1a1a1e;
      --border: rgba(255,255,255,0.07);
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,0.15);
      --gold-glow: rgba(201,168,76,0.35);
      --text: #e8e3d8;
      --text-dim: rgba(232,227,216,0.45);
      --text-mid: rgba(232,227,216,0.7);
      --red: #c0392b;
      --radius: 4px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* GRAIN OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.5;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,11,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(1.5rem, 5vw, 4rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo span { color: var(--text-dim); font-weight: 400; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 2px; }

    .header-meta {
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* HERO */
    .hero {
      padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 4rem);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2rem;
      align-items: end;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: 'CINEVAULT';
      position: absolute;
      right: -1rem;
      bottom: -2rem;
      font-family: 'Playfair Display', serif;
      font-size: clamp(6rem, 18vw, 14rem);
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 1px rgba(201,168,76,0.06);
      pointer-events: none;
      line-height: 1;
      user-select: none;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero-title em {
      font-style: italic;
      color: var(--gold);
    }

    .hero-sub {
      margin-top: 1rem;
      color: var(--text-dim);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hero-stat {
      text-align: right;
      padding: 1rem 1.5rem;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .hero-stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .hero-stat-label {
      font-size: 0.65rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 0.25rem;
    }

    /* CONTROLS */
    .controls {
      padding: 1.5rem clamp(1.5rem, 5vw, 4rem);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-wrap::before {
      content: '⌕';
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.1rem;
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      outline: none;
      border-radius: var(--radius);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--gold); }
    input[type="text"]::placeholder { color: var(--text-dim); }

    .genre-filters {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .genre-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.18s;
      white-space: nowrap;
    }

    .genre-btn:hover { border-color: var(--gold); color: var(--gold); }
    .genre-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #0a0a0b;
      font-weight: 500;
    }

    /* SORT */
    select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 0.65rem 1rem;
      outline: none;
      cursor: pointer;
      border-radius: var(--radius);
    }

    /* RESULTS BAR */
    .results-bar {
      padding: 0.75rem clamp(1.5rem, 5vw, 4rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .results-count {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .results-count strong { color: var(--gold); }

    .view-toggle { display: flex; gap: 0.4rem; }

    .view-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.8rem;
      width: 30px;
      height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.15s;
    }

    .view-btn.active { border-color: var(--gold); color: var(--gold); }

    /* GRID */
    .catalog {
      padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 5vw, 4rem);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5px;
    }

    .catalog.list-view {
      grid-template-columns: 1fr;
      gap: 1px;
    }

    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.5rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold-dim) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.22s;
    }

    .card:hover { border-color: rgba(201,168,76,0.3); transform: translateY(-2px); }
    .card:hover::before { opacity: 1; }

    .card-id {
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .card-director {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .card-director strong { color: var(--text-mid); }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .badge {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 2px;
    }

    .badge-genre {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.2);
    }

    .card-duration {
      font-size: 0.68rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .card-duration::before {
      content: '';
      width: 3px;
      height: 3px;
      background: var(--gold);
      border-radius: 50%;
      display: inline-block;
    }

    /* LIST VIEW CARD */
    .list-view .card {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1rem 1.5rem;
    }

    .list-view .card-id { margin-bottom: 0; min-width: 60px; }
    .list-view .card-title { font-size: 1rem; margin-bottom: 0; flex: 1; min-width: 160px; }
    .list-view .card-director { margin-bottom: 0; min-width: 140px; }
    .list-view .card-footer { border-top: none; padding-top: 0; margin-top: 0; gap: 1.5rem; }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface2);
      border: 1px solid rgba(201,168,76,0.2);
      max-width: 520px;
      width: 100%;
      position: relative;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

    .modal-accent {
      height: 3px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .modal-body { padding: 2rem; }

    .modal-id {
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 0.25rem;
    }

    .modal-director-line {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-bottom: 1.5rem;
    }

    .modal-director-line strong { color: var(--gold); }

    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .modal-stat {
      background: var(--surface);
      padding: 1rem;
    }

    .modal-stat-label {
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.35rem;
    }

    .modal-stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 2px;
      transition: all 0.15s;
    }

    .modal-close:hover { border-color: var(--gold); color: var(--gold); }

    /* EMPTY */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-dim);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .empty-msg {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* FOOTER */
    footer {
      margin-top: 4rem;
      padding: 1.5rem clamp(1.5rem, 5vw, 4rem);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer p { font-size: 0.68rem; color: var(--text-dim); letter-spacing: 0.08em; }
    footer a { color: var(--gold); text-decoration: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .hero { grid-template-columns: 1fr; }
      .hero::after { display: none; }
      .hero-stat { text-align: left; }
      .list-view .card { flex-wrap: wrap; gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">🎬 CineVault <span>/ archivio</span></div>
    <div class="header-meta">API: FastAPI · Python</div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div>
      <h1 class="hero-title">Il tuo <em>archivio</em><br>cinematografico.</h1>
      <p class="hero-sub">Esplora la collezione · Filtra per genere · Cerca per titolo</p>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="totalCount">—</div>
      <div class="hero-stat-label">Film in archivio</div>
    </div>
  </section>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Cerca titolo o regista…" />
    </div>
    <div class="genre-filters" id="genreFilters">
      <button class="genre-btn active" data-genre="all">Tutti</button>
    </div>
    <select id="sortSelect">
      <option value="default">Ordine default</option>
      <option value="title-asc">Titolo A→Z</option>
      <option value="title-desc">Titolo Z→A</option>
      <option value="duration-asc">Durata ↑</option>
      <option value="duration-desc">Durata ↓</option>
    </select>
  </div>

  <!-- RESULTS BAR -->
  <div class="results-bar">
    <div class="results-count">Mostrando <strong id="shownCount">0</strong> film</div>
    <div class="view-toggle">
      <button class="view-btn active" id="gridBtn" title="Griglia">⊞</button>
      <button class="view-btn" id="listBtn" title="Lista">☰</button>
    </div>
  </div>

  <!-- CATALOG -->
  <main class="catalog" id="catalog"></main>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-accent"></div>
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-body">
        <div class="modal-id" id="modalId"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-director-line" id="modalDirector"></div>
        <div class="modal-stats">
          <div class="modal-stat">
            <div class="modal-stat-label">Genere</div>
            <div class="modal-stat-value" id="modalGenre"></div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-label">Durata</div>
            <div class="modal-stat-value" id="modalDuration"></div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-label">ID</div>
            <div class="modal-stat-value" id="modalIdVal" style="font-family:'DM Mono',monospace;font-size:0.85rem;"></div>
          </div>
          <div class="modal-stat">
            <div class="modal-stat-label">Endpoint</div>
            <div class="modal-stat-value" style="font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--text-dim);" id="modalEndpoint"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>CineVault · Frontend per <a href="#">FastAPI Backend</a></p>
    <p>GET /films · GET /films/{id} · GET /film/{genre}</p>
  </footer>

  <script>
    // ─── CONFIG ──────────────────────────────────────────────────────────────
    const API_BASE = "http://localhost:8000";

    // ─── STATE ───────────────────────────────────────────────────────────────
    let DB = {};
    let activeGenre = 'all';
    let searchQuery = '';
    let sortMode = 'default';
    let isListView = false;

    // ─── LOADING UI ──────────────────────────────────────────────────────────
    function showLoading() {
      document.getElementById('catalog').innerHTML = `
        <div class="empty">
          <div class="empty-icon" style="animation: spin 1s linear infinite; display:inline-block">⟳</div>
          <div class="empty-msg" style="margin-top:1rem">Caricamento dal backend…</div>
        </div>`;
    }

    function showError(msg) {
      document.getElementById('catalog').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠</div>
          <div class="empty-msg">${msg}</div>
          <div style="margin-top:1rem;font-size:0.7rem;color:var(--text-dim)">
            Assicurati che FastAPI sia in esecuzione su <strong style="color:var(--gold)">${API_BASE}</strong>
          </div>
        </div>`;
    }

    // ─── FETCH DAL BACKEND ───────────────────────────────────────────────────
    async function loadFilms() {
      showLoading();
      try {
        const res = await fetch(`${API_BASE}/films`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        DB = await res.json();
        document.getElementById('totalCount').textContent = Object.keys(DB).length;
        buildGenreFilters();
        render();
      } catch (err) {
        showError("Impossibile connettersi al backend.");
        console.error(err);
      }
    }

    // ─── INIT ────────────────────────────────────────────────────────────────
    loadFilms();

    // ─── BUILD GENRE FILTERS ─────────────────────────────────────────────────
    function buildGenreFilters() {
      const genres = [...new Set(Object.values(DB).map(f => f.Genere))].sort();
      const container = document.getElementById('genreFilters');
      genres.forEach(g => {
        const btn = document.createElement('button');
        btn.className = 'genre-btn';
        btn.dataset.genre = g;
        btn.textContent = g;
        btn.addEventListener('click', () => { activeGenre = g; updateGenreBtns(); render(); });
        container.appendChild(btn);
      });
      container.querySelector('[data-genre="all"]').addEventListener('click', () => {
        activeGenre = 'all'; updateGenreBtns(); render();
      });
    }

    function updateGenreBtns() {
      document.querySelectorAll('.genre-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.genre === activeGenre);
      });
    }

    // ─── SEARCH ──────────────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase();
      render();
    });

    // ─── SORT ────────────────────────────────────────────────────────────────
    document.getElementById('sortSelect').addEventListener('change', e => {
      sortMode = e.target.value;
      render();
    });

    // ─── VIEW TOGGLE ─────────────────────────────────────────────────────────
    document.getElementById('gridBtn').addEventListener('click', () => {
      isListView = false;
      document.getElementById('gridBtn').classList.add('active');
      document.getElementById('listBtn').classList.remove('active');
      document.getElementById('catalog').classList.remove('list-view');
    });

    document.getElementById('listBtn').addEventListener('click', () => {
      isListView = true;
      document.getElementById('listBtn').classList.add('active');
      document.getElementById('gridBtn').classList.remove('active');
      document.getElementById('catalog').classList.add('list-view');
    });

    // ─── RENDER ──────────────────────────────────────────────────────────────
    function render() {
      let entries = Object.entries(DB);

      // Filter genre
      if (activeGenre !== 'all')
        entries = entries.filter(([, f]) => f.Genere === activeGenre);

      // Filter search
      if (searchQuery)
        entries = entries.filter(([, f]) =>
          f.Titolo.toLowerCase().includes(searchQuery) ||
          f.Regista.toLowerCase().includes(searchQuery)
        );

      // Sort
      if (sortMode === 'title-asc')  entries.sort(([,a],[,b]) => a.Titolo.localeCompare(b.Titolo));
      if (sortMode === 'title-desc') entries.sort(([,a],[,b]) => b.Titolo.localeCompare(a.Titolo));
      if (sortMode === 'duration-asc')  entries.sort(([,a],[,b]) => a.Durata - b.Durata);
      if (sortMode === 'duration-desc') entries.sort(([,a],[,b]) => b.Durata - a.Durata);

      document.getElementById('shownCount').textContent = entries.length;

      const catalog = document.getElementById('catalog');
      catalog.innerHTML = '';

      if (entries.length === 0) {
        catalog.innerHTML = `<div class="empty"><div class="empty-icon">🎞</div><div class="empty-msg">Nessun film trovato</div></div>`;
        return;
      }

      entries.forEach(([id, film], i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${i * 40}ms`;
        card.innerHTML = `
          <div class="card-id">${id}</div>
          <div class="card-title">${film.Titolo}</div>
          <div class="card-director">di <strong>${film.Regista}</strong></div>
          <div class="card-footer">
            <span class="badge badge-genre">${film.Genere}</span>
            <span class="card-duration">${film.Durata} min</span>
          </div>`;
        card.addEventListener('click', () => openModal(id, film));
        catalog.appendChild(card);
      });
    }

    // ─── MODAL ───────────────────────────────────────────────────────────────
    function openModal(id, film) {
      document.getElementById('modalId').textContent = id;
      document.getElementById('modalIdVal').textContent = id;
      document.getElementById('modalTitle').textContent = film.Titolo;
      document.getElementById('modalDirector').innerHTML = `Diretto da <strong>${film.Regista}</strong>`;
      document.getElementById('modalGenre').textContent = film.Genere;
      document.getElementById('modalDuration').textContent = `${film.Durata} min`;
      document.getElementById('modalEndpoint').textContent = `/films/${id.toLowerCase()}`;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', e => {
      if (e.target === document.getElementById('modalBackdrop')) closeModal();
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
